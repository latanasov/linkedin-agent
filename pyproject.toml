[project]
name = "linkedin-agent"
version = "0.1.0"
description = "Standalone local LinkedIn outreach agent: warm-up, connect, message with human pacing and safety caps"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "browser-use==0.11.3",
  "playwright>=1.40",
  "typer>=0.12",
  "pydantic>=2.5",
  "pydantic-settings>=2.1",
  "aiosqlite>=0.20",
  "httpx>=0.26",
  "pyyaml>=6",
  "psutil>=5.9",
  "tzdata>=2024.1",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "mcp>=2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "freezegun>=1.4",
  "ruff>=0.4",
  "mypy>=1.8",
]

[project.urls]
Repository = "https://github.com/latanasov/linkedin-agent"
Documentation = "https://github.com/latanasov/linkedin-agent/tree/main/docs"

[project.scripts]
linkedin-agent = "linkedin_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["linkedin_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# SQL statements and browser prompts read better unwrapped; tests favour one assertion per line.
"linkedin_agent/adapters/sqlite/*" = ["E501"]
"linkedin_agent/core/tasks/*" = ["E501"]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
